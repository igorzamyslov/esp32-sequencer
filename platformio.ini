[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
extra_scripts = pre:tools/gen_web.py
build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -std=gnu++17
lib_deps =
  h2zero/NimBLE-Arduino@^2.0.0
  links2004/WebSockets@^2.4.1
  bblanchon/ArduinoJson@^7.0.4
  ESP32Async/ESPAsyncWebServer
  ESP32Async/AsyncTCP

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter =
  +<*>
  -<main.cpp>
  -<Config.cpp>
  -<NetworkManager.cpp>
  -<BleScanner.cpp>
  -<TvController.cpp>
  -<Sequence.cpp>
  -<SetupServer.cpp>
  -<ConfigForm.cpp>
  -<ApiServer.cpp>
  -<adapters/blocks/WaitBlock.cpp>
  -<adapters/blocks/WaitForTriggerBlock.cpp>
  -<adapters/blocks/WolBlock.cpp>
  -<adapters/blocks/WifiHopBlock.cpp>
  -<adapters/blocks/SamsungTizenKeysBlock.cpp>
  -<adapters/predicates/HostReachablePredicate.cpp>
  -<adapters/predicates/OnWifiPredicate.cpp>
  -<adapters/triggers/HttpRouteTrigger.cpp>
  -<adapters/triggers/BleMacTrigger.cpp>
  -<adapters/persistence/NvsPersistence.cpp>
build_flags = -std=gnu++17
lib_deps =
  bblanchon/ArduinoJson@^7.0.4
