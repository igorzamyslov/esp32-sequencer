<!doctype html>
<meta charset="utf-8">
<title>esp32-tv</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{
  --ink:#111; --paper:#fafaf7; --muted:#666; --rule:#d8d6cf; --accent:#c8553d;
}
@media (prefers-color-scheme: dark){
  :root{ --ink:#e9e7e0; --paper:#15140f; --muted:#9b988e; --rule:#33312b; --accent:#e87a64; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);
  font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{max-width:680px;margin:48px auto;padding:0 20px}
h1{font-weight:600;margin:0 0 4px;letter-spacing:-0.01em}
.sub{color:var(--muted);margin:0 0 32px}
.card{border:1px solid var(--rule);border-radius:4px;padding:0;margin:0 0 24px}
.card h2{font-size:14px;font-weight:600;margin:0;padding:12px 16px;border-bottom:1px solid var(--rule)}
.row{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--rule)}
.row:last-child{border-bottom:0}
.row .name{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
.row .meta{color:var(--muted);font-size:12px;margin-left:8px}
button,a.btn{display:inline-block;font:inherit;padding:6px 12px;border:1px solid var(--rule);
  background:transparent;color:var(--ink);border-radius:3px;cursor:pointer;text-decoration:none}
button:hover,a.btn:hover{border-color:var(--ink)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.actions{padding:12px 16px;display:flex;gap:8px}
#status{padding:12px 16px;color:var(--muted);font-family:ui-monospace,SFMono-Regular,monospace;font-size:12px}
.danger{color:var(--accent)}
</style>
<div class="wrap">
  <h1>esp32-tv</h1>
  <p class="sub">Sequence builder</p>

  <div class="card">
    <h2>Sequences</h2>
    <div id="seqs"></div>
    <div class="actions">
      <a class="btn" href="/edit">New / edit</a>
    </div>
  </div>

  <div class="card">
    <h2>Triggers</h2>
    <div id="trigs"></div>
    <div class="actions">
      <a class="btn" href="/triggers">Manage triggers</a>
    </div>
  </div>

  <div class="card">
    <h2>System</h2>
    <div class="actions">
      <a class="btn" href="/settings">Settings</a>
      <button onclick="post('/setup', 'Reboot into setup mode?')">Setup mode</button>
      <button class="primary danger" onclick="post('/reset', 'Wipe all config and reboot?')">Wipe config</button>
    </div>
    <div id="status"></div>
  </div>
</div>

<script>
async function post(p, confirmMsg){
  if(confirmMsg && !confirm(confirmMsg)) return;
  const s=document.getElementById('status');
  s.textContent=p+' …';
  try{ const r=await fetch(p,{method:'POST'}); s.textContent=p+' → '+r.status+' '+await r.text(); }
  catch(e){ s.textContent=p+' failed: '+e; }
}

async function load(){
  const [seqs, trigs] = await Promise.all([
    fetch('/api/sequences').then(r=>r.json()),
    fetch('/api/triggers').then(r=>r.json()),
  ]);
  document.getElementById('seqs').innerHTML = seqs.map(s => `
    <div class="row">
      <div><span class="name">${s.name||s.id}</span>
           ${s.broken?'<span class="meta danger">broken</span>':''}
           <span class="meta">${s.nodes.length} step${s.nodes.length==1?'':'s'}</span></div>
      <div>
        <button onclick="run('${s.id}')">Run</button>
        <a class="btn" href="/edit?id=${encodeURIComponent(s.id)}">Edit</a>
      </div>
    </div>`).join('') || '<div class="row"><span class="meta">No sequences yet</span></div>';

  const seqName = id => (seqs.find(s=>s.id===id)||{}).name || id;
  document.getElementById('trigs').innerHTML = trigs.map(t => `
    <div class="row">
      <div><span class="name">${t.type}</span>
           <span class="meta">→ ${seqName(t.sequenceId)}</span>
           ${t.enabled?'':'<span class="meta">disabled</span>'}</div>
    </div>`).join('') || '<div class="row"><span class="meta">No triggers</span></div>';
}

async function run(id){
  const s=document.getElementById('status');
  s.textContent='running '+id+' …';
  try{
    const r=await fetch('/api/run?id='+encodeURIComponent(id),{method:'POST'});
    s.textContent=id+' → '+r.status+' '+await r.text();
  }catch(e){ s.textContent=id+' failed: '+e; }
}

load();
</script>
