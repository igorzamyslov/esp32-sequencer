# Run on demand:
#   uv run pre-commit run --all-files
# Install once so it runs automatically on commit:
#   uv run pre-commit install --install-hooks
#   uv run pre-commit install --hook-type commit-msg

exclude: |
  (?x)^(
    \.pio/.*|
    \.cache/.*|
    src/web/web_assets\.h|
    compile_commands\.json|
    uv\.lock
  )$

repos:
  # ----- File hygiene --------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=100]
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: detect-private-key
      - id: forbid-submodules
      - id: check-vcs-permalinks
      - id: check-builtin-literals
      - id: fix-byte-order-marker
      - id: no-commit-to-branch
        args: [--branch, main]

  # ----- Mojibake / unicode hygiene -----------------------------------------
  - repo: https://github.com/sirosen/texthooks
    rev: 0.6.7
    hooks:
      - id: forbid-bidi-controls
      - id: fix-smartquotes
        # Docs use "smart quotes" intentionally; HTML may have prose with them.
        exclude: ^(docs/|src/web/.*\.html|README\.md)
      - id: fix-ligatures

  # ----- Secrets -------------------------------------------------------------
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # ----- Spelling ------------------------------------------------------------
  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
        additional_dependencies: [tomli]
        # Config: [tool.codespell] in pyproject.toml.

  # ----- GitHub Actions ------------------------------------------------------
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.4
    hooks:
      - id: actionlint

  # ----- Shell ---------------------------------------------------------------
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.10.0-2
    hooks:
      - id: shfmt
        args: [--indent, "2", --binary-next-line, --case-indent, --simplify]
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck

  # ----- C/C++ formatting ----------------------------------------------------
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.8
    hooks:
      - id: clang-format
        types_or: [c++, c]

  # ----- C++ static analysis -------------------------------------------------
  # cppcheck must be installed locally (`brew install cppcheck` or
  # `apt install cppcheck`). The hook just shells out to the system binary.
  - repo: https://github.com/pocc/pre-commit-hooks
    rev: v1.3.5
    hooks:
      - id: cppcheck
        args:
          - --enable=warning,style,performance,portability
          - --inline-suppr
          - --suppress=missingIncludeSystem
          - --suppress=missingInclude
          - --suppress=unusedFunction
          - --suppress=unmatchedSuppression
          - --suppress=unusedStructMember
          - --suppress=passedByValue:src/adapters/triggers/HttpRouteTrigger.cpp
          - --error-exitcode=1
          - --std=c++17
          - --language=c++
          - --quiet
        # Adapter cpps include Arduino headers cppcheck can't find. Limit to
        # the platform-independent core for now.
        files: ^src/core/.*\.(cpp|h)$

  # ----- Python --------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # ----- Markdown ------------------------------------------------------------
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.42.0
    hooks:
      - id: markdownlint
        args: [--config, .markdownlint.yaml]
        # Frozen specs/plans intentionally retained as-is.
        exclude: ^docs/superpowers/

  # ----- Commit messages -----------------------------------------------------
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - --strict
          - feat
          - fix
          - docs
          - style
          - refactor
          - perf
          - test
          - build
          - ci
          - chore
          - revert
