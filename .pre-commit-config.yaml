# Run on demand:
#   pre-commit run --all-files
# Install once so it runs automatically on commit:
#   pre-commit install --install-hooks
#   pre-commit install --hook-type commit-msg

exclude: |
  (?x)^(
    \.pio/.*|
    \.cache/.*|
    src/web/web_assets\.h|
    compile_commands\.json
  )$

repos:
  # ----- File hygiene --------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=200]
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: detect-private-key
      - id: forbid-submodules

  # ----- Secrets -------------------------------------------------------------
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # ----- C/C++ ---------------------------------------------------------------
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.8
    hooks:
      - id: clang-format
        types_or: [c++, c]
        # The platform headers in adapters pull in Arduino — formatting them
        # is fine, but the ".clangd" diagnostics noise should not affect this.

  # ----- Python --------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # ----- Markdown ------------------------------------------------------------
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.42.0
    hooks:
      - id: markdownlint
        args: [--config, .markdownlint.yaml]
        # docs/superpowers/ holds frozen specs and plans — leave them as-is.
        exclude: ^docs/superpowers/

  # ----- HTML / CSS / JS (formatting only — no semantic linting) ------------
  # Skipped intentionally: the web/*.html files have inline <script>/<style>
  # blocks tuned for size in PROGMEM. Prettier would reflow them aggressively.
  # If you want JS linting later, eslint flat-config can be added.

  # ----- Commit messages -----------------------------------------------------
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - --strict
          - feat
          - fix
          - docs
          - style
          - refactor
          - perf
          - test
          - build
          - ci
          - chore
          - revert
